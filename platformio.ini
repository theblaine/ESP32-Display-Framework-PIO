[platformio]
default_envs = app_home_dashboard


; ============================================================
; Shared settings
; ============================================================

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient


; ============================================================
; Waveshare ESP32-S3-LCD-1.47 defaults
;
; All existing demo environments inherit these settings.
; ============================================================

board = esp32-s3-devkitc1-n16r8

board_build.flash_mode = qio
board_build.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DDISPLAY_BOARD_WAVESHARE_147


; ============================================================
; Waveshare demo environments
; ============================================================

[env:demo_display_widgets]
build_src_filter =
    +<demos/display_widgets/>


[env:demo_display_console]
build_src_filter =
    +<demos/display_console/>


[env:demo_display_text]
build_src_filter =
    +<demos/display_text/>


[env:demo_display_graphics]
build_src_filter =
    +<demos/display_graphics/>


[env:demo_factory]
build_src_filter =
    +<demos/factory/>


[env:demo_png]
build_src_filter =
    +<demos/png/>


[env:demo_wifi]
build_src_filter =
    +<demos/wifi/>

[env:demo_mqtt]
build_src_filter =
    +<demos/mqtt/>
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson

[env:app_home_dashboard]
build_src_filter =
    +<apps/home_dashboard/>

lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson


[env:demo_sd]
build_src_filter =
    +<demos/sd/>


[env:demo_sd_usb]
build_src_filter =
    +<demos/sd_usb/>

build_flags =
    -DBOARD_HAS_PSRAM
    -DDISPLAY_BOARD_WAVESHARE_147
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1


[env:demo_rgb]
build_src_filter =
    +<demos/rgb/>


; ============================================================
; TTGO T-Display V1.1 test environment
;
; Classic ESP32, 4 MB flash, no PSRAM.
; Uses the same display_graphics demo as the Waveshare test.
; ============================================================

[env:ttgo_display_graphics]
board = esp32dev

board_build.flash_mode = dio
board_build.flash_size = 4MB

build_flags =
    -DDISPLAY_BOARD_TTGO_T_DISPLAY

build_src_filter =
    +<demos/display_graphics/>




; ============================================================
; TTGO T-Display V1.1 text demo
; ============================================================

[env:ttgo_display_text]
board = esp32dev

board_build.flash_mode = dio
board_build.flash_size = 4MB

build_flags =
    -DDISPLAY_BOARD_TTGO_T_DISPLAY

build_src_filter =
    +<demos/display_text/>


; ============================================================
; TTGO T-Display V1.1 console demo
; ============================================================

[env:ttgo_display_console]
board = esp32dev

board_build.flash_mode = dio
board_build.flash_size = 4MB

build_flags =
    -DDISPLAY_BOARD_TTGO_T_DISPLAY

build_src_filter =
    +<demos/display_console/>



[env:ttgo_display_calibration]
board = esp32dev
board_build.flash_mode = dio
board_build.flash_size = 4MB

build_flags =
    -DDISPLAY_BOARD_TTGO_T_DISPLAY

build_src_filter =
    +<demos/display_calibration/>